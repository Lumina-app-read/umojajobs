packages:
  - apps/*
  - packages/*

# Scripts d'installation des dépendances (pnpm 10 : bloqués par défaut).
# Autorisés, car nécessaires :
# - prisma, @prisma/engines : téléchargement du moteur de migration Prisma.
# - esbuild : binaire utilisé par tsx (exécution du seed et des scripts).
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# Refusés volontairement :
# - @scarf/scarf : télémétrie de swagger-ui-dist.
# - @parcel/watcher : binaires précompilés fournis par des paquets optionnels.
# - cpu-features, ssh2, protobufjs : dépendances optionnelles de Testcontainers (accès Docker par SSH), inutiles ici.
# - @swc/core : binaires précompilés fournis par des paquets optionnels.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - cpu-features
  - protobufjs
  - ssh2
